<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garáž">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E7F0FA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>Garáž</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#E7F0FA;
  --ink:#1B2433;
  --muted:#566579;
  --card:#FFFFFF;
  --tomato:#FF6A13;
  --sun:#FFC400;
  --leaf:#22A95B;
  --sky:#2E8BEA;
  --plum:#1E63D6;
  --shadow:rgba(20,40,70,.2);
  color-scheme:light;
}
html{box-sizing:border-box;height:100%;overflow:hidden}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;color:var(--ink);background:var(--bg) linear-gradient(170deg,#D5E8FB 0%,#EEF3F8 55%,#FFE7CC 100%);
  font-family:"Baloo 2",ui-rounded,"Arial Rounded MT Bold","Helvetica Neue",system-ui,sans-serif;
  font-size:16px;line-height:1.3;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
#app{position:relative;z-index:1;height:100%;max-width:1100px;margin:0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.install{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:10px 12px;box-shadow:0 4px 0 var(--shadow);font-weight:600;font-size:15px;line-height:1.25}
.install .big{font-size:30px;flex:none}
.install .share{display:inline-flex;vertical-align:-4px;width:20px;height:20px}
.install .share svg{width:20px;height:20px;stroke:var(--sky);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.install .x{flex:none;width:36px;height:36px;border-radius:12px;background:#F3ECFF;font-size:18px;font-weight:800}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:none}
.topbar h2{margin:0;font-size:24px;font-weight:800;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 28px}

/* chunky toy buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:48px;min-width:48px;padding:0 12px;border-radius:16px;background:var(--card);
  box-shadow:0 4px 0 var(--shadow);font-weight:700;font-size:17px;flex:none;
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.btn.on{background:var(--sun)}
.btn.primary{background:var(--tomato);color:#fff;box-shadow:0 4px 0 #B8480A}
.btn.green{background:var(--leaf);color:#fff;box-shadow:0 4px 0 #2B8A5A}

/* HOME */
#home{overflow:hidden}
.home-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--shadow);font-variant-numeric:tabular-nums}
.home-body{flex:1;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:14px;padding:0 16px 10px;overflow-y:auto}
.home-body h1{margin:0;font-size:clamp(64px,19vw,112px);line-height:.9;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.home-body h1 span{display:block;background:linear-gradient(90deg,#FF6A13,#FFC400,#FF3D3D,#FF6A13);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
@keyframes shimmer{to{background-position:200% 0}}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mascot{font-size:clamp(64px,19vw,124px);line-height:1;cursor:pointer;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(20,40,70,.3))}
@keyframes bob{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px) rotate(-3deg)}}
.twinkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.twinkles i{position:absolute;font-style:normal;line-height:1;text-shadow:0 0 6px rgba(255,255,255,.9),0 0 14px rgba(255,160,60,.6);animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9600}
.hl{fill:#fff;stroke:none;pointer-events:none}
.tile .sub{position:absolute;left:8px;top:6px;font-size:18px}
.lead{margin:0;color:var(--muted);font-size:17px;font-weight:500;max-width:30ch}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (min-width:760px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;min-width:0;
  padding:14px;border-radius:26px;box-shadow:0 6px 0 var(--shadow);transition:transform .1s, box-shadow .1s;
  position:relative;overflow:hidden;
}
.mode::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-130%);animation:sheen 5s ease-in-out infinite}
.mode:nth-child(2)::after{animation-delay:1.2s}.mode:nth-child(3)::after{animation-delay:2.4s}.mode:nth-child(4)::after{animation-delay:3.6s}
@keyframes sheen{0%,62%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.mode-puzzle{background:linear-gradient(145deg,#FFD166,#FF9F45)}
.mode-color{background:linear-gradient(145deg,#A9D6FF,#7FB2FF)}
.mode-count{background:linear-gradient(145deg,#9BE7B5,#7ED0E8)}
.mode-abc{background:linear-gradient(145deg,#FFC2A8,#FFD27A)}
.mode-art{width:72px;height:72px;border-radius:18px;overflow:hidden;background:#fff;display:block;box-shadow:inset 0 0 0 4px rgba(255,255,255,.7)}
@media (min-width:760px){.mode-art{width:100%;height:auto;aspect-ratio:1}}
.mode-art canvas,.mode-art svg{width:100%;height:100%;display:block}
.art-txt{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.art-txt b{font-size:44px;font-weight:800;color:var(--tomato)}
.art-txt span{font-size:20px;letter-spacing:-2px}
.mode-name{display:block;font-size:26px;font-weight:800;line-height:1}
.mode-sub{display:block;font-size:15px;font-weight:600;opacity:.8;margin-top:3px}

/* COUNTING */
.cnt-field{position:relative;flex:1;min-height:0;margin:0 16px;border-radius:28px;overflow:hidden;background:linear-gradient(#BFE6FF,#EAF8FF 52%,#7C8A99 52%,#7C8A99 82%,#8FD16A 82%)}
.cnt-item{position:absolute;translate:-50% -50%;font-size:clamp(40px,min(14vw,9vh),88px);line-height:1;padding:6px}
.cnt-item.tapped{animation:boing .35s}
.cnt-item .num{position:absolute;right:-4px;top:-4px;background:var(--tomato);color:#fff;font-size:20px;font-weight:800;min-width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:"Baloo 2",ui-rounded,system-ui,sans-serif;box-shadow:0 2px 0 rgba(0,0,0,.15)}
@keyframes boing{0%{transform:scale(1)}40%{transform:scale(1.3)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.prompt{text-align:center;font-size:22px;font-weight:800;padding:10px 16px 0;flex:none}
.answers{display:flex;gap:12px;padding:14px 16px 14px;justify-content:center;flex:none}
.ans{flex:1;max-width:120px;height:84px;border-radius:24px;background:var(--card);font-size:48px;font-weight:800;box-shadow:0 5px 0 var(--shadow);transition:transform .08s}
.ans:active{transform:translateY(3px)}
.ans.ok{background:var(--leaf);color:#fff}
.ans.bad{animation:shake .4s;opacity:.35}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(32,48,71,.15)}
.dots i.on{background:var(--sun);box-shadow:0 0 0 2px rgba(32,48,71,.2)}

.prompt b{color:var(--tomato);font-size:1.3em}
.pick-lead{margin:0 0 12px;font-size:19px;font-weight:700;color:var(--muted)}
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.num-tile{position:relative;aspect-ratio:1;max-width:100%;border-radius:24px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .08s}
.num-tile:active{transform:translateY(3px)}
.num-tile b{font-size:54px;font-weight:800;line-height:.85}
.num-tile .pips{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:62px}
.num-tile .pips i{width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:.5}
.num-tile .badge{position:absolute;top:6px;right:8px;font-size:18px}
.num-intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;text-align:center}
.num-hero{font-size:clamp(110px,34vw,200px);font-weight:800;line-height:.9;background:linear-gradient(135deg,#FF6A13,#FFB300 50%,#2E8BEA);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(20,40,70,.15))}
.num-word{font-size:clamp(28px,8vw,40px);font-weight:800}
.num-row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:clamp(28px,8vw,44px);max-width:6.5em;min-height:1.2em;line-height:1.1}
.num-row span{animation:boing .35s}
.cnt-field.groups{display:flex;flex-direction:column;gap:10px;padding:10px;background:rgba(255,255,255,.45)}
@media (orientation:landscape){.cnt-field.groups{flex-direction:row}}
.grp{flex:1;min-height:0;background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--shadow);display:flex;align-items:center;justify-content:center;padding:6px}
.grp-in{display:flex;flex-wrap:wrap;justify-content:center;gap:0 4px;max-width:6.2em;font-size:clamp(22px,min(7vw,4.4vh),40px);line-height:1.1}
.grp.ok{box-shadow:0 0 0 5px var(--leaf),0 4px 0 var(--shadow)}
.grp.bad{animation:shake .4s;opacity:.35}
.play-btn{height:64px;padding:0 40px;font-size:26px;border-radius:22px}

/* icon tabs: big pictures so pre-readers can find their way */
.seg.icons{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg.icons button{height:auto;min-height:74px;flex-direction:column;justify-content:center;gap:0;padding:6px 4px;border-radius:20px;font-size:14px;line-height:1.1;box-shadow:0 4px 0 var(--shadow)}
.seg.icons .ico{font-size:34px;line-height:1.15}
.seg.icons button[aria-pressed="true"]{background:linear-gradient(145deg,#FF8A3D,#FF5A1F);color:#fff;box-shadow:0 4px 0 #B8440F;transform:translateY(-2px)}

/* TRACING */
.cnt-field.tracing{background:transparent;display:flex;align-items:center;justify-content:center;overflow:visible}
.trace-host{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:0 16px}
.trace-box{position:relative;background:#fff;border-radius:28px;box-shadow:0 5px 0 var(--shadow);flex:none}
.trace-box canvas{position:absolute;inset:0;border-radius:28px}
.trace-box .ti{touch-action:none}
.trace-top{display:flex;align-items:center;gap:10px;padding:0 16px 10px;flex:none}
.trace-word{flex:1;min-width:0;text-align:center;font-size:clamp(20px,6vw,28px);font-weight:800;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trace-word .em{font-size:1.4em;vertical-align:-.15em;margin-right:6px}
.trace-word .first{color:var(--tomato)}

/* ALPHABET */
.abc-card{margin:0 16px;background:var(--card);border-radius:28px;box-shadow:0 5px 0 var(--shadow);padding:14px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;text-align:center}
.abc-quiz .abc-card{flex:1;min-height:0}
.abc-big{font-size:clamp(64px,20vw,110px);font-weight:800;line-height:.9;color:var(--tomato)}
.abc-big small{font-size:.6em;color:var(--plum)}
.abc-emoji{font-size:clamp(64px,20vw,120px);line-height:1.1}
.abc-word{font-size:clamp(28px,9vw,46px);font-weight:800;letter-spacing:.06em;line-height:1.1}
.abc-word .first{color:var(--tomato)}
.abc-word .blank{display:inline-block;min-width:1.2em;border-bottom:5px solid var(--tomato);color:transparent}
.abc-word .first.pop{animation:boing .4s}
.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;padding-top:14px}
.abc-key{aspect-ratio:1;max-width:100%;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--shadow);font-size:30px;font-weight:800}
.abc-key[aria-pressed="true"]{background:var(--tomato);color:#fff;box-shadow:0 4px 0 #B8480A}
.abc-pane{flex:1;min-height:0;display:flex;flex-direction:column}
.parade{flex:none;overflow:hidden;padding:4px 0 8px;white-space:nowrap;font-size:28px;line-height:1}
@media (max-height:640px){.parade{display:none}.lead{display:none}}
.parade-track{display:inline-block;animation:parade 60s linear infinite}
@keyframes parade{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* PICKERS */
.seg-row{display:flex;align-items:center;gap:10px;padding:0 16px 10px;flex:none;flex-wrap:wrap}
.seg-label{font-weight:700;color:var(--muted)}
.seg{display:flex;gap:8px}
.seg button{height:44px;min-width:56px;padding:0 10px;border-radius:14px;background:var(--card);font-weight:800;font-size:18px;box-shadow:0 3px 0 var(--shadow);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0E1826}
.seg .gridico{width:18px;height:18px;display:inline-grid;gap:1.5px}
.seg .gridico i{background:currentColor;border-radius:1.5px;opacity:.85}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.6);font-weight:700;font-size:16px}
.chip[aria-pressed="true"]{background:var(--card);box-shadow:0 3px 0 var(--shadow);color:var(--tomato)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 var(--shadow);transition:transform .08s}
.tile:active{transform:translateY(3px)}
.tile .em{font-size:48px;line-height:1.05}
.tile .nm{font-size:15px;font-weight:700}
.tile .badge{position:absolute;top:6px;right:8px;font-size:18px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.ctile{background:var(--card);border-radius:22px;padding:8px 8px 6px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;gap:4px;align-items:stretch;transition:transform .08s}
.ctile:active{transform:translateY(3px)}
.ctile svg{width:100%;aspect-ratio:1;max-width:100%;display:block;border-radius:14px}
.ctile .nm{font-weight:700;font-size:17px;text-align:center}
.ctile svg .r{stroke-width:6}

/* PUZZLE */
.pz-area{position:relative;flex:1;overflow:hidden;touch-action:none;margin:0 0 4px}
.board{position:absolute;border-radius:8px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 3px rgba(32,48,71,.12);z-index:0;overflow:hidden}
.board img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.board .ghost{opacity:.22;transition:opacity .2s}
.board.nohint .ghost{opacity:0}
.board .full{opacity:0;transition:opacity .5s .15s}
.board.done{z-index:5000;box-shadow:0 0 0 6px var(--sun),0 10px 30px rgba(32,48,71,.25)}
.board.done .full{opacity:1}
.piece{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;filter:drop-shadow(0 3px 3px rgba(20,30,50,.32))}
.piece.placed{filter:none}
.piece.anim{transition:transform .2s cubic-bezier(.3,1.4,.6,1)}
.piece.lift{filter:drop-shadow(0 10px 10px rgba(20,30,50,.35))}
.pz-progress{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);font-size:17px;flex:none}

/* BUILDER */
.bd-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 12px 10px}
#bdSvg{width:100%;height:100%;display:block;touch-action:none}
.ghost{pointer-events:none}
.ghost .r,.ghost .k{fill:rgba(255,255,255,.1)!important;stroke:rgba(255,255,255,.85)!important;stroke-dasharray:8 6;stroke-width:3!important}
.ghost .l{stroke:rgba(255,255,255,.45)}
.ghost text{fill:rgba(255,255,255,.35)!important;stroke:none!important}
#bdSvg .part{cursor:grab}
#bdSvg .part.lift{filter:drop-shadow(0 10px 6px rgba(0,0,0,.35))}
#bdSvg .part.anim{transition:transform .22s cubic-bezier(.3,1.4,.6,1)}
#bdPlaced.drive{transition:transform 1.3s cubic-bezier(.55,0,.85,.35)}
#bdPlaced.spin .wheelpart .pin{animation:spin .45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#artPuzzle{background:#2F6FD6}

/* COLORING */
.cl-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 16px 8px}
#clSvg{width:100%;height:100%;display:block;touch-action:none;filter:drop-shadow(0 6px 0 var(--shadow));border-radius:24px}
.r{fill:#fff;stroke:var(--ink);stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}
.r.bg{stroke:none}
.k{fill:var(--ink);pointer-events:none}
.l{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.palette{flex:none;display:flex;gap:10px;overflow-x:auto;padding:14px 16px 12px;scrollbar-width:none;background:rgba(255,255,255,.55);border-radius:28px 28px 0 0}
.palette::-webkit-scrollbar{display:none}
.sw{flex:none;width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 var(--shadow);transition:transform .12s}
.sw[aria-pressed="true"]{transform:translateY(-6px) scale(1.08);box-shadow:0 0 0 3px var(--ink),0 8px 0 var(--shadow)}

/* WIN */
.overlay{position:absolute;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(32,48,71,.35)}
.win-card{background:var(--card);border-radius:32px;padding:22px 20px 20px;width:min(360px,100%);text-align:center;box-shadow:0 8px 0 var(--shadow);animation:pop .35s cubic-bezier(.3,1.5,.6,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.win-art{font-size:96px;line-height:1.1;display:block;margin:0 auto}
.win-art svg{width:180px;height:180px;display:block;margin:0 auto;border-radius:20px}
.win-card h3{margin:6px 0 2px;font-size:34px;font-weight:800;line-height:1}
.win-card p{margin:0 0 16px;color:var(--muted);font-size:18px;font-weight:600}
.win-btns{display:flex;flex-direction:column;gap:12px}
.win-btns .btn{height:54px;font-size:20px;width:100%}

@media (prefers-reduced-motion:reduce){
  .parade-track,.mascot,.mode::after,.twinkles i,.home-body h1 span{animation:none}
  .win-card{animation:none}
  .piece.anim{transition:none}
  #bdSvg .part.anim,#bdPlaced.drive{transition:none}
  #bdPlaced.spin .wheelpart .pin{animation:none}
}
</style>
</head>
<body>

<div class="twinkles" id="twinkles" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs id="glitterDefs"></defs></svg>
<div id="app">
  <!-- HOME -->
  <section id="home" class="screen">

// The child drags parts from the workbench (bottom) onto the blueprint (top).
// Identical parts (e.g. two wheels) may go to either of their slots.
let B = null;
const SVGNS = 'http://www.w3.org/2000/svg';

function openBuilder(v) {
  ac();
  B = { v, placed: 0, drag: null, done: false, slots: {} };
  $('#pzTitle').textContent = v.name;
  show('puzzle');
  const svg = $('#bdSvg');
  svg.innerHTML = `<defs><pattern id="bpGrid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/></pattern>` +
    `<pattern id="wood" width="400" height="26" patternUnits="userSpaceOnUse"><path d="M0 13 H400" stroke="rgba(90,50,10,.12)" stroke-width="2"/></pattern></defs>` +
    `<rect x="4" y="4" width="392" height="248" rx="22" fill="#2F6FD6"/><rect x="4" y="4" width="392" height="248" rx="22" fill="url(#bpGrid)"/>` +
    `<path d="M24 236 H376" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-dasharray="14 10"/>` +
    `<rect x="4" y="262" width="392" height="274" rx="22" fill="#DDA465"/><rect x="4" y="262" width="392" height="274" rx="22" fill="url(#wood)"/>` +
    `<g class="ghost">${v.parts.map(pt => pt.s).join('')}</g><g id="bdPlaced"></g><g id="bdLoose"></g>`;
  const loose = svg.querySelector('#bdLoose');
  B.parts = v.parts.map((pt, i) => {
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'part' + (/kolo/i.test(pt.n) ? ' wheelpart' : ''));
    g.dataset.i = i;
    g.innerHTML = `<g class="pin">${pt.s}</g>`;
    g.querySelectorAll('[data-c]').forEach(el => { el.style.fill = el.dataset.c; });
    loose.appendChild(g);
    const bb = g.getBBox();
    const part = { i, n: pt.n, g, cx: bb.x + bb.width / 2, cy: bb.y + bb.height / 2, w: bb.width, h: bb.height, dx: 0, dy: 0, s: 1, placed: false };
    part.key = `${pt.n}|${Math.round(bb.width)}x${Math.round(bb.height)}`;
    // invisible, generous grab area so thin parts (ladder, exhaust) are easy to catch with a finger
    const hw = Math.max(bb.width + 24, 90), hh = Math.max(bb.height + 24, 90);
    g.insertAdjacentHTML('afterbegin', `<rect class="hit" x="${part.cx - hw / 2}" y="${part.cy - hh / 2}" width="${hw}" height="${hh}" fill="transparent" pointer-events="all"/>`);
    (B.slots[part.key] = B.slots[part.key] || []).push({ x: part.cx, y: part.cy });
    return part;
  });

  $('#pzProgress').textContent = `0/${B.parts.length}`;

function setT(p) {
  p.g.style.transformOrigin = `${p.cx}px ${p.cy}px`;
  p.g.style.transform = `translate(${p.dx}px, ${p.dy}px) scale(${p.s})`;
}
function layoutTray() {
  const loose = B.parts.filter(p => !p.placed).sort(() => Math.random() - .5), n = loose.length;
  if (!n) return;
  const cols = n <= 3 ? n : n <= 6 ? 3 : 4, rows = Math.ceil(n / cols);
  const W = 380 / cols, H = 262 / rows;
  loose.forEach((p, k) => {
    const sx = 10 + W * (k % cols + .5), sy = 268 + H * (Math.floor(k / cols) + .5);
    p.ts = Math.min(1, W * .86 / p.w, H * .8 / p.h);
    p.tx = sx - p.cx; p.ty = sy - p.cy;
    p.dx = p.tx; p.dy = p.ty; p.s = p.ts; setT(p);
  });
}
function svgPt(ev) {
  const svg = $('#bdSvg'), pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
$('#bdSvg').addEventListener('pointerdown', ev => {
  if (!B || B.done || B.drag) return;
  const g = ev.target.closest && ev.target.closest('.part'); if (!g) return;
  const p = B.parts[+g.dataset.i]; if (p.placed) return;
  ev.preventDefault();
  const q = svgPt(ev);
  // the part grows to full size around its centre; keep the grabbed spot under the finger
  const relX = (q.x - (p.cx + p.dx)) / p.s, relY = (q.y - (p.cy + p.dy)) / p.s;
  B.drag = { p, id: ev.pointerId, relX, relY };
  p.s = 1; p.dx = q.x - relX - p.cx; p.dy = q.y - relY - p.cy;
  g.classList.remove('anim'); g.classList.add('lift'); $('#bdLoose').appendChild(g); setT(p);
  try { $('#bdSvg').setPointerCapture(ev.pointerId); } catch (e) {}
  sfx.pick(); say(p.n);
});
$('#bdSvg').addEventListener('pointermove', ev => {
  const d = B && B.drag; if (!d || ev.pointerId !== d.id) return;
  ev.preventDefault();
  const q = svgPt(ev), p = d.p;
  p.dx = Math.max(-p.cx, Math.min(400 - p.cx, q.x - d.relX - p.cx));
  p.dy = Math.max(-p.cy, Math.min(540 - p.cy, q.y - d.relY - p.cy));
  setT(p);
  if (Math.random() < .25) sparkleAt(ev.clientX, ev.clientY, 1);
});
function endBuildDrag(ev) {
  const d = B && B.drag; if (!d || ev.pointerId !== d.id) return;
  B.drag = null;
  const p = d.p, x = p.cx + p.dx, y = p.cy + p.dy;
  p.g.classList.remove('lift'); p.g.classList.add('anim');
  const free = B.slots[p.key], k = free.findIndex(sl => Math.hypot(sl.x - x, sl.y - y) < 28);
  if (k >= 0) {
    const sl = free.splice(k, 1)[0];
    p.dx = sl.x - p.cx; p.dy = sl.y - p.cy; p.s = 1; p.placed = true; setT(p);
    const layer = $('#bdPlaced'), next = [...layer.children].find(ch => +ch.dataset.i > p.i);
    layer.insertBefore(p.g, next || null);
    B.placed++;
    sfx.snap(); sparkleAt(ev.clientX, ev.clientY, 18);
    $('#pzProgress').textContent = `${B.placed}/${B.parts.length}`;
    if (B.placed === B.parts.length) finishBuild();
  } else {
    p.dx = p.tx; p.dy = p.ty; p.s = p.ts; setT(p);
    tone(260, .12, 'sine', .08);
  }
}
$('#bdSvg').addEventListener('pointerup', endBuildDrag);
$('#bdSvg').addEventListener('pointercancel', endBuildDrag);

sfx.honk = () => { tone(392, .16, 'square', .08); tone(494, .16, 'square', .06); tone(392, .22, 'square', .08, .24); tone(494, .22, 'square', .06, .24); };
sfx.engine = () => {
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + .02, o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(200, t + .9); o.frequency.exponentialRampToValueAtTime(130, t + 1.5);
  f.type = 'lowpass'; f.frequency.value = 900;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.2, t + .08); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6);
  o.connect(f); f.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 1.7);
};
function finishBuild() {
  B.done = true;
  const v = B.v, built = builtSet(); built.add(v.id); store.set('gz-built', [...built]);
  const layer = $('#bdPlaced');
  setTimeout(() => {
    sfx.honk(); say(`${v.name}! Hotovo! Brm brm!`);

    layer.classList.add('spin');
  }, 350);

    if (current !== 'puzzle' || B.v !== v) return;
    sfx.win(); confetti();

    const cells = [...Array(cols * rows).keys()].sort(() => Math.random() - .5).slice(0, total);
    f.className = 'cnt-field';
    f.innerHTML = cells.map(cell => itemHtml(t, cell, cols, rows)).join('');
    setPrompt(`Ťukni na <b>${n}</b> ${noun(n, t)}`, `Ťukni na ${phrase(n, t)}.`);
  } else {
    const cols = 4, rows = 3;
    const cells = [...Array(cols * rows).keys()].sort(() => Math.random() - .5).slice(0, n);
    f.className = 'cnt-field';
    f.innerHTML = cells.map(cell => itemHtml(t, cell, cols, rows)).join('');
    const opts = [n, ...nearCounts(n, 2)].sort((a, b) => a - b);
    $('#cntAnswers').innerHTML = opts.map(v => `<button class="ans" data-v="${v}">${v}</button>`).join('');
    setPrompt(`Kolik je tu ${t[2][2]}?`, `Kolik je tu ${t[2][2]}?`);
  }
}
function itemHtml(t, cell, cols, rows) {
  const x = ((cell % cols) + .5) / cols * 100 + (Math.random() - .5) * 8;
  const y = (Math.floor(cell / cols) + .5) / rows * 100 + (Math.random() - .5) * 6;
  return `<button class="cnt-item" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%">${t[0]}</button>`;
}
function taskSuccess(text) {
  N.locked = true; sfx.snap();
  const pr = PRAISE[rand(PRAISE.length)];
  $('#cntPrompt').innerHTML = `${pr} ${text || ''}`; N.sayText = pr;
  say(pr + (text ? ' ' + text : ''));
  N.step++; renderDots($('#cntDots'), N.tasks.length, N.step);
  later(nextTask, 1700);
}
function taskWrong(el) { el.classList.add('bad'); el.disabled = true; tone(180, .22, 'sine', .12); say('Zkus to znovu'); }

$('#cntField').addEventListener('click', ev => {
  if (!N) return;
  if (N.type === 'T') return;
  if (N.type === 'intro') { const h = ev.target.closest('.num-hero'); if (h) { bounce(h); say(`Tohle je číslo ${NUM_WORDS[N.n]}.`); } return; }
  if (N.locked) { const it = ev.target.closest('.cnt-item'); if (it) bounce(it); return; }
  if (N.type === 'A') {
    const g = ev.target.closest('.grp'); if (!g || g.disabled) return;
    if (+g.dataset.c === N.n) { g.classList.add('ok'); taskSuccess(); } else taskWrong(g);
    return;
  }
  const it = ev.target.closest('.cnt-item'); if (!it) return;
  if (it.querySelector('.num')) { bounce(it); return; }
  N.sel++;
  it.insertAdjacentHTML('beforeend', `<span class="num">${N.sel}</span>`);
  bounce(it); tone(380 + N.sel * 60, .12); say(NUM_WORDS[N.sel] || String(N.sel));
  if (N.type === 'B' && N.sel === N.n) { N.locked = true; later(() => taskSuccess(), 700); }
});
$('#cntAnswers').addEventListener('click', ev => {
  if (!N) return;
  if (ev.target.closest('#playBtn')) { sfx.pick(); nextTask(); return; }
  if (ev.target.closest('#traceClear')) { if (N.tracer && !N.locked) { N.tracer.clear(); tone(300, .08, 'sine', .1); } return; }
  const b = ev.target.closest('.ans'); if (!b || N.locked || b.disabled) return;
  if (+b.dataset.v === N.n) {
    b.classList.add('ok');
    let k = N.sel;
    $('#cntField').querySelectorAll('.cnt-item').forEach(it => { if (!it.querySelector('.num')) it.insertAdjacentHTML('beforeend', `<span class="num">${++k}</span>`); bounce(it); });
    taskSuccess(`Je jich ${NUM_WORDS[N.n]}.`);
  } else taskWrong(b);
});
function finishNumber() {
  const n = N.n;
  const done = new Set(store.get('gz-num', [])); done.add(n); store.set('gz-num', [...done]);
  sfx.win(); confetti(); say(`Hurá! Umíš číslo ${NUM_WORDS[n]}!`);
  const again = fnN => () => { show('count'); learnNumber(fnN); };
  showWin(`<span class="num-hero" style="font-size:120px">${n}</span>`, `Umíš číslo ${n}!`, 'Za to je hvězdička ⭐', [
    n < 10 ? { label: `Další číslo: ${n + 1}`, cls: 'primary', fn: again(n + 1) } : { label: 'Začít zase od 1', cls: 'primary', fn: again(1) },
    { label: 'Ještě jednou', cls: '', fn: again(n) },
    { label: 'Vybrat číslo', cls: '', fn: () => { show('count'); showNumPick(); } }
  ]);
}
$('#goCount').addEventListener('click', () => { ac(); startCount(); });

/* ---------- ALPHABET ---------- */
const LETTERS = [
  ['A', [['🚗','AUTO'],['🚌','AUTOBUS'],['🍍','ANANAS']]], ['B', [['⛽','BENZÍNKA'],['🎈','BALÓNEK'],['🍌','BANÁN']]],
  ['C', [['🛣️','CESTA'],['🍋','CITRON']]], ['Č', [['🚤','ČLUN'],['🧢','ČEPICE']]],
  ['D', [['🚐','DODÁVKA'],['🦖','DINOSAURUS'],['🏠','DŮM']]], ['E', [['⚡','ELEKTŘINA']]],
  ['F', [['🏎️','FORMULE'],['⚽','FOTBAL']]], ['G', [['🦍','GORILA']]],
  ['H', [['🚒','HASIČI'],['🚁','HELIKOPTÉRA'],['🍄','HOUBA']]], ['CH', [['🐙','CHOBOTNICE'],['🍞','CHLEBA']]],
  ['I', [['💉','INJEKCE']]], ['J', [['🏗️','JEŘÁB'],['🍎','JABLKO']]],
  ['K', [['🚲','KOLO'],['🚛','KAMION'],['🛴','KOLOBĚŽKA']]], ['L', [['✈️','LETADLO'],['🚂','LOKOMOTIVA'],['⛵','LOĎ']]],
  ['M', [['🏍️','MOTORKA'],['🌉','MOST'],['🐁','MYŠ']]], ['N', [['🚚','NÁKLAĎÁK'],['✂️','NŮŽKY']]],
  ['O', [['🔥','OHEŇ'],['🐑','OVCE']]], ['P', [['🚓','POLICIE'],['🛞','PNEUMATIKA'],['🐕','PES']]],
  ['R', [['🚀','RAKETA'],['🐟','RYBA']]], ['Ř', [['⛓️','ŘETĚZ']]],
  ['S', [['🚑','SANITKA'],['🚦','SEMAFOR'],['☀️','SLUNCE']]], ['Š', [['🔩','ŠROUBEK'],['🐌','ŠNEK']]],
  ['T', [['🚜','TRAKTOR'],['🚕','TAXI'],['🚊','TRAMVAJ']]], ['U', [['🛸','UFO'],['👂','UCHO']]],
  ['V', [['🚆','VLAK'],['🚁','VRTULNÍK']]], ['Z', [['🏁','ZÁVOD'],['🦓','ZEBRA']]],
  ['Ž', [['🪜','ŽEBŘÍK'],['🦒','ŽIRAFA']]]
];
const spoken = L => L === 'CH' ? 'chá' : L.toLowerCase();
const capL = L => L.length > 1 ? L[0] + L.slice(1).toLowerCase() : L;
let abcMode = 'learn', abcSel = 0, abcWord = 0, Q = null;
function startAbc() { show('abc'); setAbcMode(store.get('gz-abc', 'learn')); }
function setAbcMode(m) {
  abcMode = m; store.set('gz-abc', m);
  $('#abcSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m)));
  $('#abcLearn').hidden = m !== 'learn'; $('#abcQuiz').hidden = m !== 'quiz'; $('#abcTrace').hidden = m !== 'trace'; $('#abcDots').hidden = m !== 'quiz';
  activeTrace = null;
  if (m === 'learn') renderLearn(); else if (m === 'trace') startTrace(true); else startQuiz();
}
function renderLearn() {
  $('#abcGrid').innerHTML = LETTERS.map(([L], i) => `<button class="abc-key" data-i="${i}" aria-pressed="${i === abcSel}">${capL(L)}</button>`).join('');
  renderAbcCard();
}
function renderAbcCard() {
  const [L, words] = LETTERS[abcSel], [em, w] = words[abcWord % words.length];
  $('#abcCard').innerHTML = `<span class="abc-big">${capL(L)} <small>${L.toLowerCase()}</small></span><span class="abc-emoji">${em}</span>
    <span class="abc-word"><span class="first">${w.slice(0, L.length)}</span>${w.slice(L.length)}</span>`;
}
function sayLearn() { const [L, words] = LETTERS[abcSel]; say(`${spoken(L)}. ${words[abcWord % words.length][1].toLowerCase()}`); }
$('#abcGrid').addEventListener('click', ev => {
  const b = ev.target.closest('.abc-key'); if (!b) return;
  abcSel = +b.dataset.i; abcWord = 0;
  $('#abcGrid').querySelectorAll('.abc-key').forEach(k => k.setAttribute('aria-pressed', String(k === b)));
  renderAbcCard(); sayLearn(); tone(620, .06, 'sine', .1);
  $('#abcCard').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});
$('#abcCard').addEventListener('click', () => { abcWord++; renderAbcCard(); sayLearn(); });
$('#abcSeg').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; sfx.pick(); setAbcMode(b.dataset.m); });

let TR = null;
function startTrace(speak) {
  const [L, words] = LETTERS[abcSel], [em, w] = words[0];
  $('#trWord').innerHTML = `<span class="em">${em}</span><span class="first">${w.slice(0, L.length)}</span>${w.slice(L.length)}`;
  const host = $('#trHost'); host.innerHTML = '';
  const sel = abcSel;
  const build = () => {
    if (current !== 'abc' || abcMode !== 'trace' || abcSel !== sel) return;
    TR = makeTracer(host, capL(L), () => {
      sfx.win(); sparkleAt(innerWidth / 2, innerHeight / 2, 40);
      say(`Výborně! ${spoken(L)} jako ${w.toLowerCase()}.`);
      const traced = new Set(store.get('gz-traced', [])); traced.add(L); store.set('gz-traced', [...traced]);
      setTimeout(() => { if (current === 'abc' && abcMode === 'trace' && abcSel === sel) { abcSel = (abcSel + 1) % LETTERS.length; startTrace(true); } }, 2200);
    });
  };
  fontsReady.then(build);
  activeTrace = { rebuild: build };
  if (speak) say(`Obtáhni písmeno ${spoken(L)}. ${spoken(L)} jako ${w.toLowerCase()}.`);
}
$('#trPrev').addEventListener('click', () => { abcSel = (abcSel - 1 + LETTERS.length) % LETTERS.length; sfx.pick(); startTrace(true); });
$('#trNext').addEventListener('click', () => { abcSel = (abcSel + 1) % LETTERS.length; sfx.pick(); startTrace(true); });
$('#trClear').addEventListener('click', () => { if (TR) { TR.clear(); tone(300, .08, 'sine', .1); } });
$('#trWord').addEventListener('click', () => { const [L, words] = LETTERS[abcSel]; say(`${spoken(L)} jako ${words[0][1].toLowerCase()}`); });

function startQuiz() { Q = { round: 0, total: 6, last: -1 }; nextQuiz(); }
function nextQuiz() {
  renderDots($('#abcDots'), Q.total, Q.round);
  let li; do { li = rand(LETTERS.length); } while (li === Q.last);
  Q.last = li;
  const [L, words] = LETTERS[li], [em, w] = words[Math.random() < .5 ? 0 : rand(words.length)];
  Object.assign(Q, { L, w, locked: false });
  $('#abcQCard').innerHTML = `<span class="abc-emoji">${em}</span><span class="abc-word"><span class="blank">${L}</span>${w.slice(L.length)}</span>`;
  const opts = new Set([L]);
  while (opts.size < 3) {
    const o = LETTERS[rand(LETTERS.length)][0];
    if (w.startsWith(o)) continue; // e.g. C for CHOBOTNICE would also be "right"
    opts.add(o);
  }
  $('#abcAnswers').innerHTML = [...opts].sort(() => Math.random() - .5).map(o => `<button class="ans" data-l="${o}">${o}</button>`).join('');
  say(`Na jaké písmeno začíná ${w.toLowerCase()}?`);
}
$('#abcQCard').addEventListener('click', () => { if (Q) say(`Na jaké písmeno začíná ${Q.w.toLowerCase()}?`); });
$('#abcAnswers').addEventListener('click', ev => {
  const b = ev.target.closest('.ans'); if (!b || !Q || Q.locked || b.disabled) return;
  if (b.dataset.l === Q.L) {
    Q.locked = true; b.classList.add('ok'); sfx.snap();
    const blank = $('#abcQCard .blank'); if (blank) blank.outerHTML = `<span class="first pop">${Q.L}</span>`;
    say(`${spoken(Q.L)} jako ${Q.w.toLowerCase()}`);
    Q.round++; renderDots($('#abcDots'), Q.total, Q.round);
    setTimeout(() => { if (current !== 'abc' || abcMode !== 'quiz') return; Q.round >= Q.total ? finishQuiz() : nextQuiz(); }, 1900);
  } else {
    b.classList.add('bad'); b.disabled = true; tone(180, .22, 'sine', .12); say('Zkus to znovu');
  }
});
function finishQuiz() {
  sfx.win(); confetti(); say('Výborně! Znáš písmenka!');
  showWin('<span role="img" aria-label="Pohár">🏆</span>', 'Výborně!', `Všech ${Q.total} slov je uhodnuto.`, [
    { label: 'Hrát znovu', cls: 'primary', fn: () => { show('abc'); startQuiz(); } },
    { label: 'Poznávat písmenka', cls: '', fn: () => { show('abc'); setAbcMode('learn'); } },
    { label: 'Domů', cls: '', fn: goHome }
  ]);
}
$('#goAbc').addEventListener('click', () => { ac(); startAbc(); });

/* ---------- BOOT ---------- */
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { czVoice = null; czechVoice(); }; } catch (e) {} }
document.addEventListener('gesturestart', ev => ev.preventDefault());
document.addEventListener('dblclick', ev => ev.preventDefault(), { passive: false });
$('#glitterDefs').innerHTML = glitterDefs();
fx.cv = $('#fx'); fx.ctx = fx.cv.getContext('2d'); fxResize(); window.addEventListener('resize', fxResize);
document.addEventListener('pointerdown', ev => { if (!reduceMotion) sparkleAt(ev.clientX, ev.clientY, 8); }, { passive: true });
(function makeTwinkles() {
  const cols = ['#FFB300', '#FF7A1A', '#2E8BEA', '#FFFFFF', '#FF3D3D']; let h = '';
  for (let i = 0; i < 28; i++) h += `<i style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 100).toFixed(1)}%;font-size:${Math.round(10 + Math.random() * 18)}px;color:${cols[i % cols.length]};animation-delay:${(Math.random() * 2.4).toFixed(2)}s;animation-duration:${(1.8 + Math.random() * 1.8).toFixed(2)}s">✦</i>`;
  $('#twinkles').innerHTML = h;
})();
$('#mascot').addEventListener('click', ev => { bounce(ev.currentTarget); sparkleAt(ev.clientX, ev.clientY, 24); sfx.honk(); say('Brm brm! Tú tú!'); });
(function installHint() {
  const standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  const touch = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
  if (standalone || framed || !touch || store.get('gz-install-hidden', false)) return;
  $('#installHint').hidden = false;
  $('#installClose').addEventListener('click', () => { $('#installHint').hidden = true; store.set('gz-install-hidden', true); });
})();
renderMute();
renderHome();
drawHomeArt();
show('home');
})();
</script>
